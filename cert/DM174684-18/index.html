<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Verification</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{
    background:#FFFFFF;
    color:#8A8A8A;
    font-family:Roboto,Arial,system-ui,-apple-system,sans-serif;
    font-weight:400;
    font-size:14px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  body{padding:16px 12px;}
  .top-rule{
    border-top:1px solid #E0E0E0;
    margin-bottom:36px;
  }
  .row{
    display:flex;
    align-items:flex-start;
    margin-bottom:32px;
  }
  .row .label{
    width:48%;
    color:#8A8A8A;
    font-weight:400;
  }
  .row .value{
    width:52%;
    color:#8A8A8A;
    font-weight:400;
  }
  .row .value a{
    color:#8A8A8A;
    text-decoration:none;
  }
  .row .value a:hover{
    text-decoration:underline;
  }
  .section-header{
    font-weight:700;
    color:#8A8A8A;
    margin-top:8px;
    margin-bottom:20px;
  }
  .sub-table{
    display:flex;
    margin-top:4px;
  }
  .sub-table .col{
    width:52%;
  }
  .sub-table .col:first-child{
    width:48%;
  }
  .sub-header{
    color:#8A8A8A;
    font-weight:400;
    margin-bottom:28px;
  }
  .sub-value{
    color:#8A8A8A;
    font-weight:400;
  }
</style>
</head>
<body>
  <div class="top-rule"></div>

  <div class="row">
    <div class="label">Member Name</div>
    <div class="value">Tonderai Muyengwa</div>
  </div>

  <div class="row">
    <div class="label">ID Number</div>
    <div class="value">43-32839V43</div>
  </div>

  <div class="row">
    <div class="label">Member Status</div>
    <div class="value"></div>
  </div>

  <div class="section-header">Designations</div>

  <div class="sub-table">
    <div class="col">
      <div class="sub-header">Name</div>
      <div class="sub-value">Rope Access Technician</div>
    </div>
    <div class="col">
      <div class="sub-header">Expiry</div>
      <div class="sub-value">2029-01-28</div>
    </div>
  </div>
</body>
</html>
